name: Offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    # Fake backends and HTTP mocks only. No API key or GitHub secret is required.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.18"
          enable-cache: true
      - run: uv sync --locked --all-extras --python 3.12
      - run: uv pip check
      - name: Check pip export matches lockfile
        run: |
          uv export --locked --all-extras --no-hashes --no-emit-project --output-file requirements.txt > /dev/null
          git diff --exit-code -- requirements.txt
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync python -m pytest
      - run: uv run --no-sync mas-recovery run --config configs/restart.toml
      - run: uv run --no-sync mas-recovery suite --backend fake --overhead
